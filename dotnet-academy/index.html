<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
  <script>
    try {
      const saved = JSON.parse(localStorage.getItem("souq-academy.dotnet.v1") || "null");
      if (saved && saved.theme === "dark") {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.style.colorScheme = "dark";
      }
    } catch (_) {}
  </script>
    <title>Souq Academy — مسار .NET Backend من الصفر إلى الإنتاج</title>
    <meta
      name="description"
      content="مسار عربي متكامل لتعلّم .NET Backend من أول سطر C# حتى بناء API جاهز للإنتاج، مع مشروع E-Commerce وشرح سطرًا بسطر. يعمل محليًا بدون تسجيل دخول."
    />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232f4bd8'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='25' font-weight='700' text-anchor='middle' fill='white'%3E.NET%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/home" aria-label="Souq Academy — الرئيسية">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span class="brand-name">Souq Academy</span>
        </a>

        <nav class="primary-nav" aria-label="التنقل الرئيسي">
          <a href="#/home" data-nav="home">المسار</a>
          <a href="#/project" data-nav="project">المشروع</a>
          <a href="#/sources" data-nav="sources">المصادر</a>
        </nav>

        <div class="header-tools">
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="ابحث في الدروس"
              autocomplete="off"
              aria-label="بحث في الدروس"
              aria-expanded="false"
              aria-controls="searchResults"
            />
            <kbd>/</kbd>
            <div class="search-results" id="searchResults" hidden></div>
          </div>
          <button class="icon-btn theme-btn" id="themeToggle" type="button" aria-label="تفعيل الوضع الداكن" title="الوضع الداكن" aria-pressed="false">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <span class="header-progress" id="headerProgress">0%</span>
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="فتح قائمة الدروس" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="app-layout">
      <aside class="course-sidebar" id="sidebar" aria-label="دروس المسار">
        <div class="sidebar-top">
          <a class="sidebar-course" href="#/home">
            <span>مسار .NET Backend</span>
            <small>من الأساس إلى الإنتاج</small>
          </a>
          <button class="icon-btn sidebar-close" id="sidebarClose" type="button" aria-label="إغلاق قائمة الدروس">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="sidebar-progress">
          <div class="sidebar-progress-head">
            <div>
              <strong id="overallTitle">لنبدأ المسار</strong>
              <span id="overallSub">0 من 0 درسًا</span>
            </div>
            <span class="progress-value" id="overallPct">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true"><i id="overallBar"></i></div>
          <span class="xp" id="xpBadge">0 XP</span>
        </div>

        <nav class="module-nav" id="moduleNav" aria-label="وحدات المسار"></nav>

        <div class="sidebar-actions">
          <button type="button" id="exportBtn">تصدير التقدم</button>
          <button type="button" id="importBtn">استيراد</button>
          <button type="button" id="resetBtn" class="danger">تصفير</button>
          <input type="file" id="importFile" accept="application/json" hidden />
        </div>
      </aside>

      <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

      <div class="page-shell">
        <div class="page-meta-bar">
          <nav class="crumbs" id="crumbs" aria-label="مسار التنقل"></nav>
          <div class="page-meta-actions">
            <a href="#/project" class="text-link">مشروع Souq.NET</a>
          </div>
        </div>

        <main id="main" tabindex="-1"></main>

        <footer class="site-footer">
          <div>
            <strong>Souq Academy</strong>
            <span>تعلّم محلي، بلا حساب، وبلا تتبّع.</span>
          </div>
          <div class="footer-links">
            <a href="#/sources">المراجع</a>
            <a href="#/project">المشروع</a>
            <span>تقدمك محفوظ في <code>localStorage</code></span>
          </div>
        </footer>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="modal" id="confirmDialog">
      <form method="dialog">
        <h3 id="dialogTitle">هل أنت متأكد؟</h3>
        <p id="dialogBody">سيتم حذف كل تقدمك المحلي.</p>
        <div class="dialog-actions">
          <button value="cancel" class="btn secondary">إلغاء</button>
          <button value="confirm" class="btn danger" id="dialogConfirm">تأكيد</button>
        </div>
      </form>
    </dialog>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/content/01-foundations.js"></script>
    <script src="assets/js/content/02-anatomy.js"></script>
    <script src="assets/js/content/03-di-pipeline.js"></script>
    <script src="assets/js/content/04-api-design.js"></script>
    <script src="assets/js/content/05-architecture-data.js"></script>
    <script src="assets/js/content/06-security.js"></script>
    <script src="assets/js/content/07-production.js"></script>
    <script src="assets/js/content/08-testing.js"></script>
    <script src="assets/js/content/10-career.js"></script>
    <script src="assets/js/content/11-advanced.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
